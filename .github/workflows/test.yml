name: Run Tests

on:
  push:
    branches: [js-mongoDB, main, develop]
  pull_request:
    branches: [js-mongoDB, main, develop]
  workflow_dispatch:

env:
  NODE_ENV: test
  BUN_VERSION: '1.3.8'

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ping: 1})'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      rabbitmq:
        image: rabbitmq:3-management-alpine
        ports:
          - 5672:5672
          - 15672:15672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 30s
          --health-timeout 10s
          --health-retries 5
        env:
          RABBITMQ_DEFAULT_USER: test
          RABBITMQ_DEFAULT_PASS: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Create .env.test file
        run: |
          cat > .env.test << EOF
          NODE_ENV=test
          PORT=3000
          SERVER_URL=http://localhost:3000
          FRONTEND_URL=http://localhost:3001
          DATABASE=mongodb://localhost:27017/auth_test
          DB_POOL_SIZE=10
          REDIS_HOST=localhost
          REDIS_PORT=6379
          RABBITMQ_URL=amqp://test:test@localhost:5672
          ACCESS_TOKEN_SECRET=test_access_secret_key_for_ci
          REFRESH_TOKEN_SECRET=test_refresh_secret_key_for_ci
          ACCESS_TOKEN_EXPIRY=15m
          REFRESH_TOKEN_EXPIRY=7d
          LOG_LEVEL=error
          EOF

      - name: Wait for services
        run: |
          echo "Waiting for MongoDB..."
          timeout 60 bash -c 'until nc -z localhost 27017; do sleep 1; done'
          echo "Waiting for Redis..."
          timeout 60 bash -c 'until nc -z localhost 6379; do sleep 1; done'
          echo "Waiting for RabbitMQ..."
          timeout 60 bash -c 'until nc -z localhost 5672; do sleep 1; done'
          echo "All services are ready!"

      - name: Run type check
        run: bun run type-check

      - name: Lint code
        run: bun run lint

      - name: Run tests
        run: bun run test
        env:
          CI: true

      - name: Generate test coverage
        run: bun run test:coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage/lcov.info
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Archive test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            test-results.xml
            coverage/
            logs/
          retention-days: 7
