name: CI

on:
  pull_request:
    branches: [main, staging]
  push:
    branches: [main, staging]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: TypeScript check
        run: bunx tsc --noEmit

  lint:
    name: Lint + Layer Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: oxlint
        run: bunx oxlint .
      - name: Layer boundary check
        run: bun run check:layers

  test:
    name: Tests
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:8
        ports: ["27017:27017"]
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: scaleforge
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: scaleforge_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U scaleforge"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-retries 5
      rabbitmq:
        image: rabbitmq:3.13-alpine
        ports: ["5672:5672"]
        options: >-
          --health-cmd "rabbitmq-diagnostics ping"
          --health-interval 10s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run tests
        run: bun test
        env:
          NODE_ENV: test
          DATABASE: mongodb://localhost:27017/scaleforge_test
          POSTGRES_DATABASE_URL: postgres://scaleforge:testpassword@localhost:5432/scaleforge_test
          REDIS_HOST: localhost
          REDIS_PORT: "6379"
          REDIS_PASSWORD: ""
          RABBITMQ_URL: amqp://localhost:5672
          ACCESS_TOKEN_SECRET: test-access-secret-32-chars-minimum
          REFRESH_TOKEN_SECRET: test-refresh-secret-32-chars-minimum
          FRONTEND_URL: http://localhost:5173
          SERVER_URL: http://localhost:3000
